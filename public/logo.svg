<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="黑猫AI自动笔记小助理">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#20283b"/>
      <stop offset="1" stop-color="#0d1018"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff2e4d"/>
      <stop offset="1" stop-color="#ff7a4d"/>
    </linearGradient>
    <radialGradient id="eye" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#9af0ff"/>
      <stop offset="1" stop-color="#23b6ff"/>
    </radialGradient>
  </defs>
  <rect x="0" y="0" width="128" height="128" rx="30" fill="url(#bg)"/>
  <!-- 背景笔记卡片 -->
  <g opacity="0.85">
    <rect x="78" y="18" width="40" height="52" rx="9" fill="#ffffff" opacity="0.07"/>
    <rect x="86" y="29" width="24" height="4" rx="2" fill="#ffffff" opacity="0.20"/>
    <rect x="86" y="39" width="24" height="4" rx="2" fill="#ffffff" opacity="0.14"/>
    <rect x="86" y="49" width="16" height="4" rx="2" fill="#ffffff" opacity="0.14"/>
  </g>
  <!-- 猫耳 -->
  <path d="M33 42 L28 15 L55 35 Z" fill="#12161f"/>
  <path d="M95 42 L100 15 L73 35 Z" fill="#12161f"/>
  <path d="M37 38 L34 23 L49 34 Z" fill="url(#accent)" opacity="0.95"/>
  <path d="M91 38 L94 23 L79 34 Z" fill="url(#accent)" opacity="0.95"/>
  <!-- 猫头 -->
  <path d="M40 38 Q40 30 51 30 L77 30 Q88 30 88 38 L88 70 Q88 93 64 93 Q40 93 40 70 Z" fill="#12161f"/>
  <!-- 眼睛（AI 光） -->
  <ellipse cx="54" cy="57" rx="7.5" ry="9.5" fill="url(#eye)"/>
  <ellipse cx="74" cy="57" rx="7.5" ry="9.5" fill="url(#eye)"/>
  <circle cx="56" cy="54" r="2.1" fill="#0d1018"/>
  <circle cx="76" cy="54" r="2.1" fill="#0d1018"/>
  <!-- 鼻子 -->
  <path d="M64 69 l-5 5 h10 z" fill="url(#accent)"/>
  <!-- 嘴 -->
  <path d="M64 74 Q60 79 56 77 M64 74 Q68 79 72 77" stroke="#3a4252" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- 胡须 -->
  <g stroke="#5a6577" stroke-width="2" stroke-linecap="round" opacity="0.75">
    <path d="M40 65 H25"/><path d="M40 71 H27"/>
    <path d="M88 65 H103"/><path d="M88 71 H101"/>
  </g>
  <!-- AI 星火 -->
  <g fill="#ffd166">
    <path d="M101 60 l3.5 7.5 7.5 3.5 -7.5 3.5 -3.5 7.5 -3.5 -7.5 -7.5 -3.5 7.5 -3.5 z"/>
  </g>
</svg>
