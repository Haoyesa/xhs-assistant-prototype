<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 生图 · 黑猫智记AI</title>
  <style>
    :root {
      --header-bg: #161a22;
      --bg: #0e1014;
      --bg2: #12151b;
      --card-bg: #161a22;
      --border: #283041;
      --border2: #323a4d;
      --text: #e7eaf0;
      --text-light: #9aa3b2;
      --text-muted: #5c6678;
      --red: #ff2e4d;
      --red-hover: #e6203c;
      --green: #27ae60;
      --green-hover: #219a52;
      --blue: #4f8cff;
      --radius: 12px;
      --shadow: 0 4px 20px rgba(0,0,0,0.25);
      --transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    /* 自定义复选框，适配暗色主题 */
    input[type="checkbox"] {
      appearance: none; width: 16px; height: 16px; border: 1px solid var(--border2); border-radius: 4px;
      background: var(--bg2); cursor: pointer; position: relative; vertical-align: middle; transition: var(--transition);
    }
    input[type="checkbox"]:checked { background: var(--red); border-color: var(--red); }
    input[type="checkbox"]:checked::after {
      content: ''; position: absolute; left: 5px; top: 2px; width: 4px; height: 8px; border: solid #fff; border-width: 0 2px 2px 0; transform: rotate(45deg);
    }
    input[type="checkbox"]:disabled { opacity: .4; cursor: not-allowed; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 14px/1.6 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; color: var(--text); background: var(--bg); background-image: radial-gradient(1200px 600px at 80% -10%, #1a2030 0%, var(--bg) 55%) fixed; }
    .wrap { padding: 18px 20px 40px; max-width: 1080px; margin: 0 auto; }
    h2 { margin: 0 0 2px; font-size: 18px; color: var(--text); }
    .sub { color: var(--text-light); font-size: 12px; margin-bottom: 14px; }
    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 18px; margin-bottom: 16px; box-shadow: var(--shadow); }
    .card h3 { margin: 0 0 12px; font-size: 15px; color: var(--text); display: flex; align-items: center; gap: 8px; }
    label { display: block; font-size: 12px; color: var(--text-light); margin: 10px 0 4px; }
    input[type=text], input[type=password], input[type=number], textarea, select {
      width: 100%; padding: 9px 11px; border: 1px solid var(--border2); border-radius: 9px; background: var(--bg2); color: var(--text); font-size: 13px; font-family: inherit; transition: var(--transition);
    }
    input:focus, textarea:focus, select:focus { outline: none; border-color: var(--red); box-shadow: 0 0 0 3px rgba(255,46,77,.15); }
    textarea { resize: vertical; min-height: 90px; line-height: 1.5; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }
    .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .row.between { justify-content: space-between; }
    button { cursor: pointer; border: 1px solid var(--border2); background: var(--bg2); color: var(--text); padding: 9px 16px; border-radius: 9px; font-size: 13px; font-weight: 600; transition: var(--transition); }
    button:hover { border-color: var(--text-muted); }
    button.primary { background: var(--red); color: #fff; border: none; }
    button.primary:hover { background: var(--red-hover); transform: translateY(-1px); }
    button.primary:disabled { opacity: .5; cursor: not-allowed; transform: none; }
    button.mini { padding: 5px 10px; font-size: 12px; }
    .hint { color: var(--text-muted); font-size: 12px; }
    code { background: rgba(255,255,255,.06); padding: 1px 5px; border-radius: 5px; font-size: 12px; color: var(--text-light); }
    .msg { font-size: 12px; margin-left: 6px; }
    .msg.ok { color: #5ee08a; } .msg.bad { color: #ff6b6b; }
    details { border: 1px solid var(--border); border-radius: 9px; padding: 8px 12px; background: var(--bg2); }
    summary { cursor: pointer; font-size: 13px; font-weight: 600; color: var(--text); }
    .preview { margin-top: 10px; max-height: 220px; overflow: auto; border: 1px solid var(--border); border-radius: 9px; background: var(--bg2); }
    table { border-collapse: collapse; width: 100%; font-size: 12px; }
    th, td { border-bottom: 1px solid var(--border); padding: 6px 8px; text-align: left; max-width: 360px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text); }
    th { background: #1c212b; position: sticky; top: 0; color: var(--text-light); }
    .bar { height: 10px; border-radius: 6px; background: #1c212b; overflow: hidden; margin: 8px 0; }
    .bar > i { display: block; height: 100%; width: 0; background: linear-gradient(135deg, var(--red), #ff7a59); transition: width .2s; }
    .log { font: 12px/1.6 ui-monospace, Menlo, Consolas, monospace; background: #0a0c10; color: #d6dae0; border: 1px solid var(--border); border-radius: 9px; padding: 12px; max-height: 280px; overflow: auto; white-space: pre-wrap; }
    .log .ok { color: #5ee08a; } .log .bad { color: #ff6b6b; } .log .info { color: #8ab4ff; }
    .badge { display: inline-block; padding: 1px 8px; border-radius: 20px; font-size: 11px; background: rgba(255,46,77,.15); color: #ff6b81; font-weight: 600; }
  </style>
</head>
<body>
  <div class="wrap">
    <h2>🖼️ AI 生图 <span class="badge">批量封面生成</span></h2>
    <div class="sub">上传 CSV（含 <b>宝贝id</b> 与 <b>标题</b> 列），按你写的提示词逐行生成封面图，自动保存到 <code>images/&lt;商品ID&gt;_1/</code>。</div>

    <!-- 配置 -->
    <div class="card">
      <h3>⚙️ 图像生成 API 配置 <span class="hint">（独立于文本 AI，单独配置）</span></h3>
      <div class="grid2">
        <div>
          <label>图像 API 供应商</label>
          <select id="imgProvider">
            <option value="ark">方舟 API（OpenAI /images/generations）</option>
            <option value="suchuang">速创 API（wuyinkeji /api/async/image_gpt）</option>
          </select>
        </div>
        <div>
          <label>API Base URL <span class="hint">（由供应商固定，不可修改）</span></label>
          <input id="imgBaseUrl" type="text" readonly style="cursor:not-allowed;opacity:.85" />
        </div>
        <div>
          <label>模型 Model</label>
          <input id="imgModel" type="text" placeholder="gpt-image-2" />
        </div>
        <div>
          <label>API Key</label>
          <input id="imgApiKey" type="password" placeholder="sk-..." />
        </div>
        <div>
          <label>尺寸 Size</label>
          <select id="imgSize">
            <option value="auto">auto 默认</option>
            <option value="1024x1024">1024x1024 正方形</option>
            <option value="1536x1024">1536x1024 横版</option>
            <option value="1024x1536">1024x1536 竖版</option>
            <option value="2048x2048">2048x2048 2K正方形</option>
            <option value="2048x1152">2048x1152 2K横版</option>
            <option value="3840x2160">3840x2160 4K横版</option>
            <option value="2160x3840">2160x3840 4K竖版</option>
          </select>
        </div>
        <div>
          <label>每篇生成张数（1-8）</label>
          <input id="imgCount" type="number" min="1" max="8" value="1" />
        </div>
      </div>
      <div>
        <label>附加请求体（可选 JSON，供应商特殊字段）</label>
        <input id="imgExtra" type="text" placeholder='{"quality":"low","format":"jpeg"}' style="width:100%" />
      </div>
      <label>提示词模板（支持占位符 <code>{{标题}}</code> <code>{{商品ID}}</code> <code>{{内容}}</code>）</label>
      <textarea id="imgPrompt" rows="6"></textarea>
      <div class="row" style="margin-top:10px">
        <button id="saveCfgBtn" class="primary">💾 保存配置</button>
        <span id="cfgMsg" class="msg"></span>
        <span class="hint">配置保存在本地设置，下次自动读取。</span>
      </div>
    </div>

    <!-- CSV -->
    <div class="card">
      <h3>📄 上传 CSV 并解析</h3>
      <div class="row">
        <input id="csvFile" type="file" accept=".csv,text/csv" />
        <button id="parseBtn" class="mini">解析</button>
        <span id="parseMsg" class="msg"></span>
      </div>
      <div class="hint" style="margin-top:6px">CSV 需含 <b>宝贝id</b> 与 <b>标题</b> 两列（其余列忽略）。参考格式：<code>宝贝id,标题,内容,话题,发布日期,发布时间</code></div>
      <div id="preview" class="preview" style="display:none"></div>
    </div>

    <!-- 生成 -->
    <div class="card">
      <h3>🚀 开始生成</h3>
      <div class="hint">将逐行调用图像 API（串行，避免并发超限）。生成结果写入图片根目录下的 <code>images/&lt;商品ID&gt;_1/1.png</code>，并写入 <code>title.txt</code> 供发布流水线使用。</div>
      <div class="row between" style="margin-top:10px">
        <div class="row">
          <button id="genBtn" class="primary" disabled>▶ 开始生成（已选 0 行）</button>
          <button id="stopBtn" disabled>⏹ 停止</button>
          <span id="genMsg" class="msg"></span>
        </div>
        <div class="hint">图片根目录：<code id="rootPreview">—</code></div>
      </div>
      <div class="bar"><i id="bar"></i></div>
      <div id="log" class="log"></div>
    </div>
  </div>

<script>
const $ = (s) => document.querySelector(s);
const apiFetch = (m, u, b) => fetch(u, { method: m, headers: { 'Content-Type': 'application/json' }, body: b ? JSON.stringify(b) : undefined }).then(r => r.json());

let rows = [];          // 解析出的 [{productId, title, content, selected}]
let running = false;
let stopFlag = false;
let keyCache = { ark: '', suchuang: '' };   // 各供应商独立 Key，切换时自动带出，无需重填
let currentProvider = 'ark';                // 当前 Key 输入框归属的供应商

// 供应商预设
const PROVIDER_PRESETS = {
  ark: {
    baseUrl: 'https://api.aiyungc.cn/v1',
    model: 'gpt-image-2',
    size: '1024x1536',
    extra: '{"quality":"low","format":"jpeg"}',
    sizeOptions: [
      { value: 'auto', text: 'auto 默认' },
      { value: '1024x1024', text: '1024x1024 正方形' },
      { value: '1536x1024', text: '1536x1024 横版' },
      { value: '1024x1536', text: '1024x1536 竖版' },
      { value: '2048x2048', text: '2048x2048 2K正方形' },
      { value: '2048x1152', text: '2048x1152 2K横版' },
      { value: '3840x2160', text: '3840x2160 4K横版' },
      { value: '2160x3840', text: '2160x3840 4K竖版' }
    ]
  },
  suchuang: {
    baseUrl: 'https://api.wuyinkeji.com',
    model: 'gpt-image-2',
    size: '9:16',
    extra: '',
    sizeOptions: [
      { value: 'auto', text: 'auto 默认' },
      { value: '1:1', text: '1:1 正方形' },
      { value: '3:2', text: '3:2 横版' },
      { value: '2:3', text: '2:3 竖版' },
      { value: '16:9', text: '16:9 横版' },
      { value: '9:16', text: '9:16 竖版（小红书推荐）' },
      { value: '4:3', text: '4:3 横版' },
      { value: '3:4', text: '3:4 竖版' }
    ]
  }
};

function applyProviderUI(provider) {
  const preset = PROVIDER_PRESETS[provider] || PROVIDER_PRESETS.ark;
  const sizeSel = $('#imgSize');
  const current = sizeSel.value;
  sizeSel.innerHTML = preset.sizeOptions.map(o => `<option value="${o.value}">${o.text}</option>`).join('');
  // 尽量保留已选值；新供应商不支持则回退预设
  const keep = preset.sizeOptions.some(o => o.value === current);
  sizeSel.value = keep ? current : preset.size;
}

function setFixedBaseUrl(provider) {
  const preset = PROVIDER_PRESETS[provider] || PROVIDER_PRESETS.ark;
  $('#imgBaseUrl').value = preset.baseUrl;
}

// 把 Key 输入框切换为指定供应商已保存的 Key
function syncApiKey(provider) {
  $('#imgApiKey').value = keyCache[provider] || '';
}

function fillPreset() {
  const provider = $('#imgProvider').value;
  const preset = PROVIDER_PRESETS[provider] || PROVIDER_PRESETS.ark;
  setFixedBaseUrl(provider);
  if (!$('#imgModel').value.trim()) $('#imgModel').value = preset.model;
  $('#imgSize').value = preset.size;
  if (!$('#imgExtra').value.trim()) $('#imgExtra').value = preset.extra;
}

$('#imgProvider').addEventListener('change', () => {
  // 切换前先把当前输入框的 Key 存回原供应商，再带出新供应商的 Key
  keyCache[currentProvider] = $('#imgApiKey').value.trim();
  const provider = $('#imgProvider').value;
  currentProvider = provider;
  applyProviderUI(provider);
  fillPreset();
  syncApiKey(provider);
});

// 读取配置回填
async function loadCfg() {
  try {
    const r = await apiFetch('GET', '/api/settings');
    const s = r || {};
    const provider = s.imgAiProvider || 'ark';
    currentProvider = provider;
    // 各供应商独立 Key；ark 回退旧字段 imgAiApiKey（老配置迁移前）
    keyCache.ark = s.imgAiApiKeyArk || (provider === 'ark' ? (s.imgAiApiKey || '') : '');
    keyCache.suchuang = s.imgAiApiKeySuchuang || '';
    $('#imgProvider').value = provider;
    applyProviderUI(provider);
    setFixedBaseUrl(provider);
    syncApiKey(provider);
    $('#imgModel').value = s.imgAiModel || '';
    $('#imgSize').value = s.imgAiSize || PROVIDER_PRESETS[provider].size;
    $('#imgCount').value = s.imgAiCount || 1;
    $('#imgExtra').value = s.imgAiExtra || '';
    $('#imgPrompt').value = s.imgAiPromptTemplate || '';
    $('#rootPreview').textContent = s.imagesRoot || '(默认：软件数据目录/images)';
  } catch (e) {
    log('读取配置失败：' + e.message, 'bad');
  }
}

$('#saveCfgBtn').onclick = async () => {
  const provider = $('#imgProvider').value;
  const key = $('#imgApiKey').value.trim();
  keyCache[provider] = key;             // 当前供应商的 Key 入缓存
  const cfg = {
    imgAiProvider: provider,
    imgAiBaseUrl: $('#imgBaseUrl').value.trim(),
    // 两个供应商的 Key 一起保存，切换时无需重填；imgAiApiKey 保留为旧字段兼容
    imgAiApiKeyArk: keyCache.ark,
    imgAiApiKeySuchuang: keyCache.suchuang,
    imgAiApiKey: key,
    imgAiModel: $('#imgModel').value.trim(),
    imgAiSize: $('#imgSize').value.trim() || 'auto',
    imgAiCount: Math.max(1, Math.min(8, parseInt($('#imgCount').value, 10) || 1)),
    imgAiExtra: $('#imgExtra').value.trim(),
    imgAiPromptTemplate: $('#imgPrompt').value,
  };
  const r = await apiFetch('POST', '/api/settings', cfg);
  $('#cfgMsg').textContent = r.ok ? '已保存 ✓' : ('失败：' + (r.error || ''));
  $('#cfgMsg').className = 'msg ' + (r.ok ? 'ok' : 'bad');
  if (r.ok) loadCfg();
};

// ---- CSV 编码检测与解析（支持引号字段与字段内换行）----
function decodeBuffer(buf) {
  // 先按 UTF-8 解码；若出现替换字符，则按 GBK/GB18030 重解
  let utf8 = '';
  try { utf8 = new TextDecoder('utf-8').decode(buf); } catch (e) { utf8 = ''; }
  if (!utf8.includes('\uFFFD')) return utf8;
  try { return new TextDecoder('gbk').decode(buf); } catch (e) {
    try { return new TextDecoder('gb18030').decode(buf); } catch (e2) { return utf8; }
  }
}
function parseCSV(text) {
  text = text.replace(/^\uFEFF/, ''); // 去 UTF-8 BOM
  const rows = []; let row = []; let field = ''; let q = false; let i = 0;
  while (i < text.length) {
    const c = text[i];
    if (q) {
      if (c === '"') {
        if (text[i + 1] === '"') { field += '"'; i += 2; continue; }
        q = false; i++; continue;
      }
      field += c; i++; continue;
    }
    if (c === '"') { q = true; i++; continue; }
    if (c === ',') { row.push(field); field = ''; i++; continue; }
    if (c === '\r') { i++; continue; }
    if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; i++; continue; }
    field += c; i++;
  }
  if (field.length || row.length) { row.push(field); rows.push(row); }
  return rows.filter(r => r.some(c => c.trim() !== ''));
}

function cleanHeader(h) { return (h || '').replace(/^\uFEFF/, '').trim().toLowerCase(); }
function pickCols(header, names) {
  for (const n of names) {
    const idx = header.findIndex(h => cleanHeader(h) === n.toLowerCase());
    if (idx >= 0) return idx;
  }
  return -1;
}

$('#parseBtn').onclick = () => {
  const f = $('#csvFile').files[0];
  if (!f) { $('#parseMsg').textContent = '请先选择 CSV 文件'; $('#parseMsg').className = 'msg bad'; return; }
  const reader = new FileReader();
  reader.onload = () => {
    const text = decodeBuffer(reader.result);
    const raw = parseCSV(text);
    if (raw.length < 2) { $('#parseMsg').textContent = 'CSV 内容过少（至少含表头+1 行）'; $('#parseMsg').className = 'msg bad'; return; }
    const header = raw[0];
    const idIdx = pickCols(header, ['宝贝id', '宝贝ID', '商品id', 'id', 'itemid']);
    const titleIdx = pickCols(header, ['标题', '宝贝标题', '商品标题', 'name', '商品名称']);
    const contentIdx = pickCols(header, ['内容', '详情', '描述', 'desc', 'description']);
    if (idIdx < 0 && titleIdx < 0) {
      $('#parseMsg').textContent = '未找到「宝贝id」或「标题」列。检测到的表头：' + header.map(cleanHeader).join(' / ');
      $('#parseMsg').className = 'msg bad'; return;
    }
    rows = [];
    for (let r = 1; r < raw.length; r++) {
      const cells = raw[r];
      const productId = (idIdx >= 0 ? (cells[idIdx] || '').trim() : '');
      const title = (titleIdx >= 0 ? (cells[titleIdx] || '').trim() : '');
      const content = (contentIdx >= 0 ? (cells[contentIdx] || '').trim() : '');
      if (!title && !productId) continue;
      rows.push({ productId, title, content, selected: true });
    }
    $('#parseMsg').textContent = `解析成功，共 ${rows.length} 行`; $('#parseMsg').className = 'msg ok';
    renderPreview();
    updateGenBtn();
  };
  reader.readAsArrayBuffer(f);
};

function renderPreview() {
  const allChecked = rows.length > 0 && rows.every(r => r.selected);
  const head = `<tr><th style="width:34px"><input type="checkbox" id="selAll" title="全选/反选" ${allChecked ? 'checked' : ''}></th><th>#</th><th>宝贝id</th><th>标题</th></tr>`;
  const body = rows.slice(0, 200).map((r, i) => `<tr>
    <td><input type="checkbox" class="sel-row" data-idx="${i}" ${r.selected ? 'checked' : ''}></td>
    <td>${i + 1}</td>
    <td>${esc(r.productId)}</td>
    <td>${esc(r.title)}</td>
  </tr>`).join('');
  $('#preview').innerHTML = `<table><thead>${head}</thead><tbody>${body}</tbody></table>`;
  $('#preview').style.display = rows.length ? 'block' : 'none';

  $('#selAll').onclick = () => {
    const checked = $('#selAll').checked;
    rows.forEach(r => r.selected = checked);
    renderPreview();
    updateGenBtn();
  };
  $$('.sel-row').forEach(cb => {
    cb.onclick = () => {
      const idx = parseInt(cb.dataset.idx, 10);
      rows[idx].selected = cb.checked;
      renderPreview();
      updateGenBtn();
    };
  });
}

function updateGenBtn() {
  const n = rows.filter(r => r.selected).length;
  $('#genBtn').disabled = n === 0 || running;
  $('#genBtn').textContent = `▶ 开始生成（已选 ${n} 行）`;
}
const esc = (s) => (s || '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const $$ = (s) => Array.from(document.querySelectorAll(s));

function buildPrompt(tpl, item) {
  return (tpl || '')
    .replace(/\{\{\s*标题\s*\}\}/g, item.title)
    .replace(/\{\{\s*商品ID\s*\}\}/g, item.productId)
    .replace(/\{\{\s*内容\s*\}\}/g, item.content);
}

function log(msg, cls) {
  const el = $('#log');
  const line = document.createElement('div');
  if (cls) line.className = cls;
  line.textContent = msg;
  el.appendChild(line);
  el.scrollTop = el.scrollHeight;
}

$('#genBtn').onclick = async () => {
  if (running) return;
  const tpl = $('#imgPrompt').value;
  if (!tpl.trim()) { log('请先填写提示词模板（或在配置中点「保存配置」）。', 'bad'); return; }
  const selected = rows.filter(r => r.selected);
  if (!selected.length) { log('请先在 CSV 预览中勾选要生成的行。', 'bad'); return; }
  running = true; stopFlag = false;
  $('#genBtn').disabled = true; $('#stopBtn').disabled = false;
  $('#log').innerHTML = '';
  let okCount = 0, failCount = 0;
  for (let i = 0; i < selected.length; i++) {
    if (stopFlag) { log('⏹ 已停止（已处理 ' + i + '/' + selected.length + '）', 'info'); break; }
    const item = selected[i];
    const seq = rows.indexOf(item) + 1;
    const folder = (item.productId ? item.productId + '_1' : 'row_1');
    const prompt = buildPrompt(tpl, item);
    log(`[${i + 1}/${selected.length}] #${seq} ${item.productId || '(无id)'} → ${folder}`, 'info');
    try {
      const r = await apiFetch('POST', '/api/ai-image/generate', { folderName: folder, prompt, title: item.title, count: $('#imgCount').value, size: $('#imgSize').value });
      if (r.ok) { okCount++; log('  ✓ 已保存 ' + (r.files || []).join(', '), 'ok'); }
      else {
        failCount++;
        log('  ✗ ' + (r.error || '生成失败'), 'bad');
        if (r.suchuangDebug) {
          try {
            const dbg = typeof r.suchuangDebug === 'string' ? JSON.parse(r.suchuangDebug) : r.suchuangDebug;
            log('  [调试] taskId=' + dbg.taskId, 'info');
            if (dbg.lastPolls && dbg.lastPolls.length) {
              for (const p of dbg.lastPolls) {
                log(`    轮询#${p.attempt} ${p.status} ${p.url} → ${p.body.slice(0, 120)}`, 'info');
              }
            }
          } catch {}
        }
      }
    } catch (e) { failCount++; log('  ✗ 请求异常：' + e.message, 'bad'); }
    $('#bar').style.width = Math.round(((i + 1) / selected.length) * 100) + '%';
  }
  log(`完成：成功 ${okCount} / 失败 ${failCount}。图片位于 images/ 目录下。`, okCount && !failCount ? 'ok' : (failCount ? 'bad' : 'info'));
  running = false;
  updateGenBtn();
  $('#stopBtn').disabled = true;
};

$('#stopBtn').onclick = () => { stopFlag = true; };

loadCfg();
</script>
</body>
</html>
